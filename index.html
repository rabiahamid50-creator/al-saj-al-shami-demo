<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>الصاج الشامي</title>
<style>
:root{--wine:#621318;--wine2:#3d0a0e;--gold:#d5ad49;--gold2:#f0d487;--cream:#fbf7f0;--paper:#fffdf9;--ink:#2c2020;--muted:#786c66;--line:#e8ddd1;--green:#2f7a43}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.hero{background:#4b0d11;position:relative;border-bottom:1px solid #c7a24a;overflow:hidden}.heroArt{display:block;width:100%;height:auto}.heroOverlay{display:none}
.heroOverlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,0,3,.03),rgba(25,0,3,.12))}
.heroTop{position:absolute;z-index:2;top:0;left:50%;transform:translateX(-50%);width:min(1440px,calc(100% - 36px));padding-top:24px;display:flex;justify-content:space-between;align-items:flex-start}
.langBtn,.smallLogo{border:1px solid #ddb84d;background:#530d12;color:#fff6dc;border-radius:13px;box-shadow:0 8px 22px #0002}
.langBtn{padding:10px 16px;font-weight:900}
.smallLogo{width:64px;height:64px;display:grid;place-items:center;overflow:hidden;font-size:10px;font-weight:950;letter-spacing:.04em}
.smallLogo img{width:100%;height:100%;object-fit:contain;background:#fff;padding:5px}
.shell{width:min(1440px,calc(100% - 36px));margin:16px auto 110px;position:relative;z-index:5}
.search{background:#fff;border:1px solid var(--line);box-shadow:0 12px 28px #4c17111a;border-radius:16px;padding:15px 18px;display:flex;gap:10px;align-items:center}
.search input{border:0;outline:0;flex:1;background:transparent;font-size:15px;color:var(--ink)}
.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0 10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.chip{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:999px;font-weight:850;color:#4d3a35}
.chip.active{background:var(--wine);color:#fff;border-color:var(--wine)}
.moreBtn{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:999px;font-weight:850}
.sectionHead{display:flex;justify-content:space-between;align-items:flex-end;margin:24px 0 12px}
.sectionHead h2{margin:0;color:var(--wine2);font-size:28px}
.sectionHead small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;display:grid;grid-template-columns:1fr 155px;min-height:150px;overflow:hidden;box-shadow:0 5px 18px #4a160b0c}
.cardBody{padding:16px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.cardImg{width:100%;height:100%;object-fit:cover;cursor:zoom-in;filter:saturate(1.08) contrast(1.04);transition:.2s}
.cardImg:hover{transform:scale(1.025);filter:saturate(1.12) contrast(1.06)}
.name{font-weight:950;font-size:16px;color:#321a19;line-height:1.45}
.priceRow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:18px}
.price{font-size:21px;font-weight:950;color:var(--wine)}
.price small{font-size:11px;color:#8a682b}
.kcal{font-size:11px;color:#9a7a38;margin-top:4px}
.addBtn{border:0;background:var(--wine);color:#fff;padding:9px 13px;border-radius:10px;font-weight:950;white-space:nowrap}
.drawerBackdrop,.modalBackdrop{position:fixed;inset:0;background:#20060a80;z-index:60;display:none}
.drawerBackdrop.open,.modalBackdrop.open{display:flex}
.drawerBackdrop{align-items:flex-end;justify-content:center;padding:12px}
.drawer{width:min(850px,100%);max-height:80vh;overflow:auto;background:#fffdf9;border-radius:22px;padding:18px}
.drawerGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.drawerGrid button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;font-weight:850}
.modalBackdrop{align-items:center;justify-content:center;padding:16px}
.productModal{width:min(940px,100%);max-height:92vh;overflow:auto;background:#fffdf9;border-radius:22px;display:grid;grid-template-columns:1.15fr .85fr;position:relative;box-shadow:0 34px 90px #0006}
.productPhoto{width:100%;height:100%;min-height:460px;object-fit:cover;filter:saturate(1.1) contrast(1.05)}
.productInfo{padding:30px;display:flex;flex-direction:column;justify-content:center}
.productInfo h2{font-size:29px;color:var(--wine2);margin:0 0 12px}
.productInfo p{color:var(--muted);line-height:1.7}
.productPrice{font-size:26px;font-weight:950;color:var(--wine);margin:14px 0}
.closeBtn{position:absolute;top:12px;right:12px;width:38px;height:38px;border:0;border-radius:11px;background:#fff;box-shadow:0 5px 16px #0002;font-size:22px;z-index:3}
.cartBar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(900px,calc(100% - 22px));z-index:50;background:linear-gradient(135deg,#4d0f14,#72171e);color:#fff;border:1px solid #8e343d;border-radius:17px;box-shadow:0 18px 45px #33070b4d;padding:9px 10px 9px 14px;display:flex;align-items:center;gap:12px}
.cartMeta{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.cartIcon{width:40px;height:40px;border-radius:11px;background:#ffffff12;border:1px solid #ffffff18;display:grid;place-items:center;position:relative}
.badge{position:absolute;top:-7px;right:-7px;background:#d8242d;color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 5px;font-size:11px;display:grid;place-items:center;font-weight:950}
.cartText{display:grid;gap:1px}
.cartText small{opacity:.68;font-size:10px}
.cartText b{font-size:15px}
.cartBtn{border:0;border-radius:11px;background:linear-gradient(180deg,#efd27e,#d3a94e);color:#3a0a0d;padding:11px 17px;font-weight:950;min-width:130px}
.cartBtn:disabled{opacity:.45;cursor:default}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,18px);background:var(--green);color:white;padding:11px 16px;border-radius:12px;font-weight:900;opacity:0;transition:.2s;z-index:100;box-shadow:0 15px 35px #0003;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.cartPanel{width:min(760px,100%);max-height:82vh;overflow:auto;background:#fffdf9;border-radius:22px}
.cartHead{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.cartHead h3{margin:0;color:var(--wine2)}
.cartItems{display:grid}
.cartLine{padding:13px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.cartProduct{display:flex;gap:10px;align-items:center;min-width:0}
.cartProduct img{width:58px;height:58px;object-fit:cover;border-radius:10px}
.cartProduct b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cartProduct small{color:var(--muted)}
.cartActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:29px;height:29px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:900}
.remove{border:0;background:#fff0f0;color:#9c3434;padding:7px 9px;border-radius:8px;font-weight:900}
.cartTotal{padding:17px 18px;background:#fff6e4;display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:950;color:var(--wine2)}
.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){
.hero{min-height:0}.heroArt{height:270px;object-fit:cover;object-position:center}
.heroTop{width:calc(100% - 24px);padding-top:14px}
.smallLogo{width:50px;height:50px;border-radius:12px}
.shell{width:calc(100% - 20px);margin-top:12px}
.grid{grid-template-columns:1fr}
.card{grid-template-columns:1fr 130px}
.productModal{grid-template-columns:1fr}
.productPhoto{min-height:300px;max-height:46vh}
.productInfo{padding:21px}
.drawerGrid{grid-template-columns:repeat(2,1fr)}
.cartText small{display:none}
.cartBtn{min-width:108px;padding:10px 12px}
}

@media(max-width:700px){
body{overflow-x:hidden}.hero{min-height:0}.heroArt{height:250px;object-fit:cover;object-position:center}
.heroTop{width:calc(100% - 20px);padding-top:10px}.langBtn{padding:8px 12px;font-size:13px}.smallLogo{width:44px;height:44px}
.shell{width:calc(100% - 16px);margin:10px auto 105px}.search{padding:12px 14px;border-radius:14px}
.toolbar{margin-top:12px;display:block}.chips{display:flex;flex-wrap:nowrap;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 12px;font-size:12px}.moreBtn{width:100%;margin-top:3px;padding:9px}
.sectionHead{margin:17px 2px 10px;align-items:center}.sectionHead h2{font-size:22px}.grid{grid-template-columns:1fr;gap:10px}
.card{grid-template-columns:minmax(0,1fr) 118px;min-height:126px;border-radius:14px}.cardBody{padding:12px}.name{font-size:14px}
.priceRow{margin-top:12px;align-items:center}.price{font-size:18px}.addBtn{padding:8px 10px;font-size:12px}.cardImg{min-height:126px}
.drawerBackdrop{padding:8px}.drawer{border-radius:18px;padding:13px}.drawerGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.productModal{width:100%;max-height:88vh;grid-template-columns:1fr;border-radius:18px}.productPhoto{height:42vh;min-height:250px;max-height:360px}.productInfo{padding:18px}.productInfo h2{font-size:22px}.productPrice{font-size:22px;margin:9px 0}
.cartBar{bottom:8px;width:calc(100% - 14px);padding:7px 8px 7px 10px;border-radius:14px;gap:8px}.cartIcon{width:36px;height:36px}.cartText b{font-size:12px}.cartBtn{min-width:96px;padding:9px 10px;font-size:12px}
.cartPanel{width:100%;max-height:86vh;border-radius:18px}.cartLine{grid-template-columns:1fr;padding:11px 13px}.cartActions{justify-content:space-between}.cartProduct img{width:50px;height:50px}
}
@media(max-width:390px){.hero{min-height:0}.heroArt{height:225px;object-fit:cover;object-position:center}.shell{margin-top:8px}.card{grid-template-columns:minmax(0,1fr) 105px}.cardImg{min-height:120px}.cartText{max-width:115px}}


/* FINAL VISUAL POLISH V15 */
.hero{background:#4b0d11;overflow:hidden;border-bottom:0;position:relative}
.heroPicture{display:block;width:100%}
.heroArt{display:block;width:100%;height:auto!important;object-fit:contain!important;object-position:center!important}
.search{height:50px;padding:0 16px;border-radius:14px;box-shadow:0 7px 20px rgba(76,23,17,.10);border-color:#eadfd4}
.search input{font-size:14px}
.productPhoto{object-fit:contain!important;background:#f6f0e8;padding:10px}
@media(max-width:700px){
  .heroArt{width:100%;height:auto!important;object-fit:contain!important}
  .heroTop{padding-top:12px}
  .shell{margin-top:10px}
  .search{height:44px;padding:0 13px;border-radius:13px;box-shadow:0 5px 14px rgba(76,23,17,.08)}
  .search input{font-size:13px}
  .productPhoto{height:auto;min-height:250px;max-height:48vh;object-fit:contain!important}
}
@media(max-width:390px){.heroArt{height:auto!important;object-fit:contain!important}}


/* ===== V18 FINAL MENU BODY SPACING / ALIGNMENT ===== */

/* Search is compact but still easy to tap. */
main.shell > .search{
  width:min(1060px,100%)!important;
  min-height:48px!important;
  margin:0 auto!important;
  padding:0 16px!important;
  border-radius:14px!important;
  box-shadow:0 7px 20px rgba(76,23,17,.07)!important;
}
main.shell > .search input{
  font-size:14px!important;
  font-weight:500!important;
  line-height:1.35!important;
}

/* Categories and More are one compact group. */
main.shell > .toolbar{
  margin:12px 0 0!important;
  padding:0!important;
  display:block!important;
}
main.shell .categoryTrack{
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  gap:7px!important;
  width:100%;
  margin:0!important;
  padding:0!important;
}

  flex:0 1 auto!important;

  gap:7px!important;

  padding:0!important;
}

main.shell .moreBtn{

}

main.shell > .sectionHead{

  min-height:0!important;
  align-items:flex-end!important;
  gap:12px!important;
}
main.shell > .sectionHead > div:first-child{
  display:grid!important;
  gap:0!important;
  margin:0!important;
  padding:0!important;
}
main.shell #eyebrow{
  margin:0 0 2px!important;
  padding:0!important;
  font-size:11.5px!important;
  line-height:1.2!important;
  font-weight:650!important;
  color:#8a7971!important;
}
main.shell .sectionHead h2{
  margin:0!important;
  padding:0!important;
  font-size:27px!important;
  line-height:1.03!important;
  letter-spacing:-.025em!important;
  font-weight:850!important;
}
main.shell #count{
  margin:0!important;
  padding:0 0 2px!important;

  color:#8a7971!important;
}

/* Cards start immediately after heading. */
main.shell > .grid{
  margin-top:0!important;
  gap:13px!important;
}
main.shell .card{
  border-radius:14px!important;
  box-shadow:0 3px 12px rgba(70,28,20,.045)!important;
}
main.shell .cardBody{
  padding:14px 15px!important;
}
main.shell .name{
  font-size:15.5px!important;
  line-height:1.3!important;
  font-weight:800!important;
}
main.shell .priceRow{
  margin-top:12px!important;
}
main.shell .price{
  font-size:18.5px!important;

  font-weight:850!important;
}
main.shell .addBtn{
  min-height:36px!important;
  padding:0 11px!important;
  font-size:12px!important;
}

/* Tablet: keep the entire category group on a clean horizontal track. */
@media(max-width:980px){
  main.shell .categoryTrack{
    justify-content:flex-start!important;

    flex-wrap:nowrap!important;
    padding:0 0 4px!important;

  }

  main.shell .chips{
    flex:0 0 auto!important;
    flex-wrap:nowrap!important;
    justify-content:flex-start!important;
  }
}

/* Mobile: compact vertical rhythm; no full-width More button. */

  main.shell > .search{
    min-height:44px!important;
    padding:0 13px!important;
    border-radius:13px!important;
  }
  main.shell > .search input{
    font-size:13px!important;
  }

    margin-top:9px!important;
  }

    gap:6px!important;

  }

    gap:6px!important;
  }

  }

  }

  }

@media(max-width:390px){

/* ===== FINAL MOBILE HEIGHT + CATEGORY TRACK FIX ===== */
@media(max-width:700px){
  /* Use the same high-resolution wide V15 artwork, only shorter on mobile. */
  .hero{min-height:0!important;overflow:hidden!important;background:#4b0d11!important}
  .heroPicture{display:block!important;width:100%!important;height:190px!important;overflow:hidden!important}
  .heroArt{display:block!important;width:100%!important;height:190px!important;object-fit:cover!important;object-position:center center!important}
  .heroTop{padding-top:8px!important;width:calc(100% - 18px)!important}
  .langBtn{padding:7px 11px!important;font-size:12px!important;border-radius:11px!important}
  .smallLogo{width:40px!important;height:40px!important;border-radius:10px!important}

  main.shell .moreBtn{display:inline-flex!important;width:auto!important;margin:0!important;align-items:center!important;justify-content:center!important}

  main.shell #eyebrow{font-size:10px!important;margin-bottom:0!important}

<body translate="no">

const $=s=>document.querySelector(s);
const nameOf=x=>lang==='ar'?(x.ar||x.en):x.en;
const catName=c=>lang==='ar'?(c.ar||c.en):c.en;
const money=n=>lang==='ar'?`${Number(n).toFixed(2)} ر.س`:`${Number(n).toFixed(2)} SAR`;
const assetSrc=p=>{
  if(!p)return '';
  if(/^https?:|^data:|^blob:/.test(p))return p;
  return p.startsWith('assets/')?p:'assets/'+p.replace(/^\.\//,'');
};

function applyBrand(){
 if(settings.logoData){ $('#smallLogo').style.display='grid'; $('#smallLogo').innerHTML=`<img src="${settings.logoData}" alt="Restaurant logo">`; }
 else $('#smallLogo').style.display='none';
}

function categories(){
 return [{id:'all',ar:'الكل',en:'All'},...DATA.categories];
}
function renderCategories(){
 const first=categories().slice(0,7);
 $('#chips').innerHTML=first.map(c=>`<button class="chip ${active===c.id?'active':''}" onclick="setCategory('${c.id}')">${catName(c)}</button>`).join('');
 $('#drawerGrid').innerHTML=categories().map(c=>`<button onclick="setCategory('${c.id}');closeDrawer()">${catName(c)}</button>`).join('');
 $('#moreBtn').textContent=lang==='ar'?'المزيد':'More';
}
function filtered(){
 return DATA.items.filter(i=>i.available!==false)
 .filter(i=>active==='all'||i.cat===active)
 .filter(i=>!query||i.en.toLowerCase().includes(query)||String(i.ar||'').includes(query));
}
function render(){
 const list=filtered();
 const c=categories().find(x=>x.id===active)||categories()[0];
 $('#sectionTitle').textContent=active==='all'?(lang==='ar'?'كل الأصناف':'All Dishes'):catName(c);
 $('#eyebrow').textContent=lang==='ar'?'مختارات الصاج الشامي':'Al Saj Al Shami selections';
 $('#count').textContent=lang==='ar'?`${list.length} صنف`:`${list.length} items`;
 $('#search').placeholder=lang==='ar'?'ابحث عن طبق...':'Search for dishes...';
 $('#grid').innerHTML=list.map(i=>`<article class="card">
   <div class="cardBody">
      <div class="name">${nameOf(i)}</div>
      <div class="priceRow">
        <div><div class="price">${money(i.price)}</div><div class="kcal">${i.kcal?i.kcal+' kcal':''}</div></div>
        <button class="addBtn" onclick="addToCart('${i.id}')">${lang==='ar'?'+ إضافة':'+ Add'}</button>
      </div>
   </div>
   <img class="cardImg" src="${assetSrc(i.img)}" alt="${nameOf(i)}" onerror="this.style.visibility='hidden'" onclick="openProduct('${i.id}')">
 </article>`).join('');
 updateCartBar();
}

window.setCategory=id=>{active=id;renderCategories();render()};
$('#search').addEventListener('input',e=>{query=e.target.value.toLowerCase();render()});
$('#moreBtn').onclick=()=>$('#drawerBackdrop').classList.add('open');
function closeDrawer(){$('#drawerBackdrop').classList.remove('open')}
$('#drawerBackdrop').onclick=e=>{if(e.target.id==='drawerBackdrop')closeDrawer()};

window.openProduct=id=>{
 const i=DATA.items.find(x=>String(x.id)===String(id)); if(!i)return;
 current=i;
 $('#productPhoto').src=assetSrc(i.img);
 $('#productPhoto').alt=nameOf(i);
 $('#productName').textContent=nameOf(i);
 $('#productDesc').textContent=lang==='ar'?'صورة واضحة للصنف. أضف هذا الصنف إلى طلبك من هنا.':'Large dish preview. Add this item directly to your order.';
 $('#productPrice').textContent=money(i.price);
 $('#productAdd').textContent=lang==='ar'?'أضف إلى السلة':'Add to Cart';
 $('#productBackdrop').classList.add('open');
};
$('#productClose').onclick=()=>$('#productBackdrop').classList.remove('open');
$('#productBackdrop').onclick=e=>{if(e.target.id==='productBackdrop')$('#productBackdrop').classList.remove('open')};
$('#productAdd').onclick=()=>{if(current){addToCart(current.id);$('#productBackdrop').classList.remove('open')}};

window.addToCart=id=>{
 const i=DATA.items.find(x=>String(x.id)===String(id)); if(!i)return;
 const row=cart.find(x=>x.id===i.id);
 if(row)row.qty++; else cart.push({id:i.id,en:i.en,ar:i.ar||'',price:Number(i.price),qty:1,img:i.img});
 updateCartBar();
 showToast(lang==='ar'?`تمت إضافة ${i.ar||i.en} إلى السلة`:`${i.en} added to cart`);
};
function totals(){
 return {count:cart.reduce((a,x)=>a+x.qty,0),total:cart.reduce((a,x)=>a+x.qty*x.price,0)};
}
function updateCartBar(){
 const t=totals();
 $('#cartBadge').textContent=t.count;
 $('#cartSmall').textContent=lang==='ar'?'سلة الطلب':'Your Cart';
 $('#cartSummary').textContent=lang==='ar'?`${t.count} عنصر · ${t.total.toFixed(2)} ر.س`:`${t.count} items · ${t.total.toFixed(2)} SAR`;
 $('#viewCart').textContent=lang==='ar'?'عرض السلة':'View Cart';
 $('#viewCart').disabled=t.count===0;
}
function showToast(text){
 const el=$('#toast');el.textContent=text;el.classList.add('show');
 clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),1400);
}
window.changeQty=(idx,d)=>{
 if(!cart[idx])return;cart[idx].qty+=d;if(cart[idx].qty<=0)cart.splice(idx,1);updateCartBar();renderCart();
};
window.removeItem=idx=>{cart.splice(idx,1);updateCartBar();renderCart()};
function renderCart(){
 const t=totals();
 $('#cartTitle').textContent=lang==='ar'?'سلة الطلب':'Your Cart';
 $('#totalLabel').textContent=lang==='ar'?'الإجمالي':'Total';
 $('#totalValue').textContent=money(t.total);
 $('#cartItems').innerHTML=cart.length?cart.map((x,idx)=>`<div class="cartLine">
  <div class="cartProduct"><img src="${assetSrc(x.img)}" alt="" onerror="this.style.visibility='hidden'"><div><b>${lang==='ar'?(x.ar||x.en):x.en}</b><small>${money(x.price)}</small></div></div>
  <div class="cartActions"><div class="qty"><button onclick="changeQty(${idx},-1)">−</button><b>${x.qty}</b><button onclick="changeQty(${idx},1)">+</button></div><b>${money(x.price*x.qty)}</b><button class="remove" onclick="removeItem(${idx})">${lang==='ar'?'حذف':'Remove'}</button></div>
 </div>`).join(''):`<div class="empty">${lang==='ar'?'السلة فارغة':'Your cart is empty'}</div>`;
}
$('#viewCart').onclick=()=>{if(totals().count){renderCart();$('#cartBackdrop').classList.add('open')}};
$('#cartClose').onclick=()=>$('#cartBackdrop').classList.remove('open');
$('#cartBackdrop').onclick=e=>{if(e.target.id==='cartBackdrop')$('#cartBackdrop').classList.remove('open')};

$('#langBtn').onclick=()=>{
 lang=lang==='ar'?'en':'ar';
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 $('#langBtn').textContent=lang==='ar'?'English':'العربية';
 renderCategories();render();
 if($('#productBackdrop').classList.contains('open')&&current)openProduct(current.id);
 if($('#cartBackdrop').classList.contains('open'))renderCart();
};

window.addEventListener('storage',e=>{if(e.key==='alsaj-demo-state'||e.key==='alsaj-demo-settings')location.reload()});
applyBrand();renderCategories();render();
</script>
</body></html>
